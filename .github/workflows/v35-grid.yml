name: v3.5 risk grid

# Builds the v3.5 wildfire-risk grid (every California land tile, A x B model) on the API and
# refreshes the four zone caches from it. The API runs the build in a background thread and
# answers 202 at once; this job then polls /admin/v35-status until today's grid is live.
# 14:00 UTC (06-07 PT) scores today from the forecast; 22:00 UTC (14-15 PT) re-scores with the
# afternoon's observed RTMA. If a build fails, the map keeps serving v3.4 (a model is always live).

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v35-grid
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: https://firescope-api.onrender.com/api/research
      INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
    steps:
      - name: Start the grid build
        run: |
          http=$(curl -s -X POST -H "X-Internal-Token: $INTERNAL_CRON_TOKEN" -o /tmp/start.json -w '%{http_code}' --max-time 60 "$API_BASE/admin/build-v35-grid")
          cat /tmp/start.json; echo
          [ "$http" = "202" ] || [ "$http" = "409" ] || { echo "::error::build start returned $http"; exit 1; }
      - name: Wait for today's grid
        run: |
          start_ts=$(date -u +%s)
          for i in $(seq 1 80); do
            sleep 30
            curl -s --max-time 30 "$API_BASE/admin/v35-status" -o /tmp/status.json || continue
            built=$(python3 -c "import json;d=json.load(open('/tmp/status.json'));print(d.get('built_at') or '')")
            if [ -n "$built" ] && [ "$(date -u -d "$built" +%s)" -ge "$start_ts" ]; then
              cat /tmp/status.json; echo; exit 0
            fi
          done
          echo "::error::v3.5 grid not rebuilt within 40 min (map stays on the previous grid or v3.4)"; cat /tmp/status.json; exit 1
