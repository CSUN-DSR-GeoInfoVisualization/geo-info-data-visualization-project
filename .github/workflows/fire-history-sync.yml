name: Weekly fire-history sync

# Rebuilds backend/data/fire_history/supplement.json.gz: California wildfires in
# NIFC's InterAgency Fire Perimeter History that CAL FIRE's record (FRAP) lacks,
# plus years recovered for FRAP's undated fires. data.fire_history_archive
# validates every record (California land, not prescribed, not a duplicate) and
# raises on any source error, so an outage turns this run red and
# notify-failure.yml emails the details.

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Rebuild the supplement from CAL FIRE and NIFC
        working-directory: backend
        run: python -m data.fire_history_archive build
      - name: Commit if records changed
        id: commit
        run: |
          git config user.name 'IdoCohen560'
          git config user.email 'ido.the.cohen@gmail.com'
          git add backend/data/fire_history/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: fire-history sync ($(date -u +%F))"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push && break
              [ "$i" = 3 ] && exit 1
              sleep $((i * 10))
            done
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy so the API serves the new records
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-domain-deployment.yml --repo "${{ github.repository }}"
